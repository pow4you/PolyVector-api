[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "polyvec"
version = "0.1.0"
description = "Class-based Python wrapper around two PolyVector line-drawing vectorization methods (Bessmeltsev & Solomon 2019; Puhachov et al. 2021)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
# Keypoint detection for PolyVector Flow (the upstream network and its helpers).
flow = [
    "torch>=2.0",
    "scikit-image",
    "matplotlib",
]
# Word detectors for the "text" method (pick one or more; borrowed from inksight).
doctr = ["python-doctr>=1.0"]                                   # InkSight notebook's engine (PyTorch)
paddle = ["paddlepaddle>=3.0", "paddleocr>=3.0"]                 # newer: PP-OCR
tesseract = ["pytesseract>=0.3.13"]                              # also needs the tesseract program

[tool.uv]
# paddlex (under paddleocr) pins PyYAML==6.0.2, which has no wheels for Python 3.14;
# resolving the PaddleOCR extra on its own keeps it from holding the others back.
conflicts = [[{ extra = "paddle" }, { extra = "doctr" }]]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
polyvec = "polyvec.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The upstream sources, build glue and model weights travel with the package so
# that backends can be (re)built from an installed copy.
polyvec = [
    "native/*",
    "native/compat/gurobi/*",
    "vendor/*.md",
    "vendor/pv/*",
    "vendor/pv/src/*",
    "vendor/pv/src/LBFGS/*",
    "vendor/pvflow/*",
    "vendor/pvflow/src/*",
    "vendor/pvflow/LBFGS/*",
    "vendor/pvflow/prediction/*",
    "vendor/pvflow/inputs/*",
    "vendor/paal/*",
    "vendor/paal/paal/greedy/*",
    "vendor/paal/paal/utils/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "backend: needs a compiled backend (local binaries or Docker)",
    "torch: needs the optional 'flow' dependencies (PyTorch etc.)",
]
