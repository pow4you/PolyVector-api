# Binary wheels with the in-process backends (polyvec._native) for
# Windows, Linux and macOS, CPython 3.10 - 3.14.
#
# cibuildwheel drives everything; its configuration lives in pyproject.toml
# ([tool.cibuildwheel]).  The C++ dependencies (OpenCV, Eigen, Boost, HiGHS)
# come from vcpkg, pinned by src/polyvec/native/vcpkg.json and linked
# statically.  vcpkg's binary packages are cached between runs, so only the
# first run (or a dependency change) compiles OpenCV.
#
# All 15 wheels are built on every run; pytest runs on the oldest and the
# newest supported Python (3.10, 3.14).  A manual run ("Run workflow") can
# test every version instead.
#
# Pushing a version tag (v0.1.0, ...) additionally publishes the wheels and the
# sdist as a GitHub Release (pre-release while the version is 0.x or has an
# a/b/rc suffix), then uploads exactly those release files to PyPI.  The tag
# must match the version in pyproject.toml.
#
# PyPI upload uses trusted publishing (no token stored here): on pypi.org the
# project trusts this repository, this workflow file (wheels.yml) and the
# GitHub environment "pypi".  To upload an existing GitHub Release that was
# not published to PyPI (e.g. one made before this job existed), use "Run
# workflow" with publish-release set to its tag; that run builds nothing.

name: wheels

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      test-all:
        description: "Test every Python version (default: only 3.10 and 3.14)"
        type: boolean
        default: false
      publish-release:
        description: "Only upload this existing GitHub Release (e.g. v0.1.0) to PyPI; builds nothing"
        type: string
        default: ""

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: ${{ matrix.name }}
    if: ${{ !inputs.publish-release }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            # The build runs in a manylinux container that sees the runner's
            # file system under /host.
            cache-prefix: /host
          - name: windows-amd64
            os: windows-2022
          - name: macos-arm64
            os: macos-15
            arch: arm64
            triplet: arm64-osx-polyvec
            deployment-target: "11.0"
          - name: macos-x86_64
            os: macos-15-intel
            arch: x86_64
            triplet: x64-osx-polyvec
            deployment-target: "10.15"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('src/polyvec/native/vcpkg.json', 'src/polyvec/native/vcpkg-triplets/**', 'ci/install-vcpkg-deps.*') }}
          restore-keys: vcpkg-${{ matrix.name }}-

      - name: Build and test wheels
        uses: pypa/cibuildwheel@9c00cb4f6b517705a3794b22395aedc36257242c # v3.2.1
        env:
          # github.workspace is empty inside strategy.matrix, so the path is
          # built here; Linux reaches it through the container's /host mount.
          VCPKG_DEFAULT_BINARY_CACHE: ${{ matrix.cache-prefix }}${{ github.workspace }}/.vcpkg-cache
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          POLYVEC_VCPKG_TRIPLET: ${{ matrix.triplet }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
          # Build everything, test the oldest and newest Python; a manual run
          # with test-all ticked tests all ("none" matches no build).
          CIBW_TEST_SKIP: ${{ inputs.test-all && 'none' || 'cp311-* cp312-* cp313-*' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  sdist:
    if: ${{ !inputs.publish-release }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # On a version tag: publish everything built above as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check that the tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          flags=()
          if [[ "$GITHUB_REF_NAME" =~ ^v0\. || "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "polyvec ${GITHUB_REF_NAME#v}" --generate-notes "${flags[@]}"

  # Upload the GitHub Release's files to PyPI: after a tag's release, or for
  # an existing release named in a manual run (publish-release).
  pypi:
    needs: [release]
    if: >-
      always() && (
        (startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish-release != '')
      )
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/polyvec/
    permissions:
      id-token: write   # trusted publishing
      contents: read
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.publish-release || github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
